[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantit-nyu-hackathon"
version = "0.1.0"
description = "Quantit x NYU Stern Finance Agent Hackathon (TECH-UB 41, Nov 2026) — Mirage Benchmark & Audit Toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
include = ["quantit_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
